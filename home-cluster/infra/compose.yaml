services:
  omni-ovh-infra-provider:
    image: ghcr.io/ktijssen/omni-infra-provider-ovhcloud:v0.4.0
    env_file: .env.infra-provider-ovhcloud
    environment:
      OS_AUTH_URL: https://auth.cloud.ovh.net/v3
      OMNI_ENDPOINT: https://timniverse.eu-central-1.omni.siderolabs.io
    command:
      - --id=home-cluster-ovhcloud
  omni-booter:
    image: ghcr.io/siderolabs/booter:v0.4.1-dirty
    network_mode: host
    env_file: .env.booter
    expose:
      - "50084"
      - "67/udp"
      - "4011/udp"
